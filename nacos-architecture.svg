  <rect x="60" y="564" width="6" height="108" rx="3" fill="#10b981"/>
  <text x="80" y="587" font-size="13" font-weight="700" fill="#064e3b">核心业务模块</text>
  <text x="80" y="604" font-size="11" fill="#6b7280">Core Services</text>

