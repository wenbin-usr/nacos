  <rect x="60" y="1090" width="1320" height="86" rx="10" fill="#ffffff" stroke="#dbe3ee" stroke-width="1"/>
  <rect x="60" y="1090" width="6" height="86" rx="3" fill="#0284c7"/>
  <text x="80" y="1113" font-size="13" font-weight="700" fill="#0c4a6e">生态集成</text>
  <text x="80" y="1130" font-size="11" fill="#6b7280">Integration</text>

  <g filter="url(#shadow)">
