    <text x="310" y="1132" text-anchor="middle" font-size="14" font-weight="700" fill="#0c4a6e">Istio</text>
    <text x="310" y="1150" text-anchor="middle" font-size="11" fill="#1e6a9a">MCP / 服务网格对接</text>

    <rect x="460" y="1108" width="220" height="56" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
    <text x="570" y="1132" text-anchor="middle" font-size="14" font-weight="700" fill="#0c4a6e">K8s Sync</text>
    <text x="570" y="1150" text-anchor="middle" font-size="11" fill="#1e6a9a">Kubernetes 服务同步</text>

    <rect x="720" y="1108" width="220" height="56" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
    <text x="830" y="1132" text-anchor="middle" font-size="14" font-weight="700" fill="#0c4a6e">Prometheus</text>
    <text x="830" y="1150" text-anchor="middle" font-size="11" fill="#1e6a9a">指标暴露 / 监控</text>

    <rect x="980" y="1108" width="220" height="56" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
    <text x="1090" y="1132" text-anchor="middle" font-size="14" font-weight="700" fill="#0c4a6e">CMDB</text>
    <text x="1090" y="1150" text-anchor="middle" font-size="11" fill="#1e6a9a">标签 / 元数据来源</text>
  </g>

  <!-- ============================ Legend ============================ -->
  <g transform="translate(60,1186)">
    <text x="0" y="14" font-size="11" fill="#6b7280">说明：箭头方向自上而下表示请求 / 数据流向；左侧色条标识分层；插件层通过 SPI 横向贯穿各业务模块。</text>
  </g>
</svg>
