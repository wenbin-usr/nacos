  <rect x="60" y="704" width="1320" height="86" rx="10" fill="#ffffff" stroke="#dbe3ee" stroke-width="1"/>
  <rect x="60" y="704" width="6" height="86" rx="3" fill="#8b5cf6"/>
  <text x="80" y="727" font-size="13" font-weight="700" fill="#4c1d95">一致性协议层</text>
  <text x="80" y="744" font-size="11" fill="#6b7280">Consistency</text>

  <g filter="url(#shadow)">
    <rect x="360" y="722" width="320" height="56" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
