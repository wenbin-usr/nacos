<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1220" viewBox="0 0 1440 1220" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',Helvetica,Arial,sans-serif">
  <!-- ============================ Background ============================ -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2"/>
      <feOffset dx="0" dy="2" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1440" height="1220" fill="url(#bg)"/>

  <!-- ============================ Title ============================ -->
  <text x="720" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#1f2937">Nacos 整体架构</text>
  <text x="720" y="74" text-anchor="middle" font-size="14" fill="#6b7280">Dynamic Naming &amp; Configuration Service · 服务发现 / 配置管理 / AI Agent 注册中心</text>

  <!-- ============================ Helper: layer band + label ============================ -->
  <!-- Layer 1 : Client & UI -->
  <rect x="60" y="95" width="1320" height="92" rx="10" fill="#ffffff" stroke="#dbe3ee" stroke-width="1"/>
  <rect x="60" y="95" width="6" height="92" rx="3" fill="#3b82f6"/>
  <text x="80" y="118" font-size="13" font-weight="700" fill="#1e3a8a">客户端 &amp; UI 层</text>
  <text x="80" y="135" font-size="11" fill="#6b7280">Client &amp; UI</text>

  <!-- L1 boxes -->
  <g filter="url(#shadow)">
    <rect x="220" y="118" width="220" height="56" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="330" y="128" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Java SDK</text>
    <text x="330" y="160" text-anchor="middle" font-size="11" fill="#475569">Naming / Config / AI 客户端</text>

    <rect x="480" y="118" width="220" height="56" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="590" y="142" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">OpenAPI / gRPC Client</text>
    <text x="590" y="160" text-anchor="middle" font-size="11" fill="#475569">多语言 HTTP 调用</text>

    <rect x="740" y="118" width="220" height="56" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="850" y="142" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Maintainer Client</text>
    <text x="850" y="160" text-anchor="middle" font-size="11" fill="#475569">运维管控客户端</text>

    <rect x="1000" y="118" width="220" height="56" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="1110" y="142" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Console UI (React)</text>
    <text x="1110" y="160" text-anchor="middle" font-size="11" fill="#475569">Web 控制台前端</text>
  </g>

  <!-- arrow L1 -> L2 -->
  <line x1="720" y1="190" x2="720" y2="214" stroke="#9aa4b2" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Layer 2 : Communication -->
  <rect x="60" y="218" width="1320" height="78" rx="10" fill="#ffffff" stroke="#dbe3ee" stroke-width="1"/>
  <rect x="60" y="218" width="6" height="78" rx="3" fill="#f59e0b"/>
  <text x="80" y="241" font-size="13" font-weight="700" fill="#78350f">通信层</text>
  <text x="80" y="258" font-size="11" fill="#6b7280">Communication</text>

  <g filter="url(#shadow)">
    <rect x="410" y="235" width="280" height="50" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="550" y="256" text-anchor="middle" font-size="14" font-weight="600" fill="#78350f">gRPC（主通信协议）</text>
    <text x="550" y="274" text-anchor="middle" font-size="11" fill="#7c5410">长连接 · 双向流 · 客户端推送</text>

    <rect x="750" y="235" width="280" height="50" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="890" y="256" text-anchor="middle" font-size="14" font-weight="600" fill="#78350f">HTTP / REST（兼容协议）</text>
    <text x="890" y="274" text-anchor="middle" font-size="11" fill="#7c5410">V3 OpenAPI · /v3/{client|admin|console}</text>
  </g>

  <!-- arrow L2 -> L3 -->
  <line x1="720" y1="300" x2="720" y2="324" stroke="#9aa4b2" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Layer 3 : Access & Filter -->
  <rect x="60" y="328" width="1320" height="92" rx="10" fill="#ffffff" stroke="#dbe3ee" stroke-width="1"/>
  <rect x="60" y="328" width="6" height="92" rx="3" fill="#ec4899"/>
  <text x="80" y="351" font-size="13" font-weight="700" fill="#831843">访问 &amp; 过滤层</text>
  <text x="80" y="368" font-size="11" fill="#6b7280">Access / Filter</text>

  <g filter="url(#shadow)">
    <rect x="180" y="351" width="200" height="56" rx="8" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5"/>
    <text x="280" y="375" text-anchor="middle" font-size="14" font-weight="600" fill="#831843">Auth Filter</text>
    <text x="280" y="393" text-anchor="middle" font-size="11" fill="#7a3a52">@Secured · 鉴权 / 签名</text>

    <rect x="420" y="351" width="200" height="56" rx="8" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5"/>
    <text x="520" y="375" text-anchor="middle" font-size="14" font-weight="600" fill="#831843">Param Check</text>
    <text x="520" y="393" text-anchor="middle" font-size="11" fill="#7a3a52">参数校验 · paramcheck</text>

    <rect x="660" y="351" width="200" height="56" rx="8" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5"/>
    <text x="760" y="375" text-anchor="middle" font-size="14" font-weight="600" fill="#831843">Request Context</text>
    <text x="760" y="393" text-anchor="middle" font-size="11" fill="#7a3a52">请求上下文 · 过滤链</text>

    <rect x="900" y="351" width="200" height="56" rx="8" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5"/>
    <text x="1000" y="375" text-anchor="middle" font-size="14" font-weight="600" fill="#831843">Flow Control</text>
    <text x="1000" y="393" text-anchor="middle" font-size="11" fill="#7a3a52">限流 · 控制 · control</text>

    <rect x="1140" y="351" width="200" height="56" rx="8" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5"/>
    <text x="1240" y="375" text-anchor="middle" font-size="14" font-weight="600" fill="#831843">Remote / gRPC Srv</text>
    <text x="1240" y="393" text-anchor="middle" font-size="11" fill="#7a3a52">连接 · 能力协商</text>
  </g>

  <!-- arrow L3 -> L4 -->
  <line x1="720" y1="424" x2="720" y2="448" stroke="#9aa4b2" stroke-width="1.6" marker-end="url(#arrow)"/>

