    <text x="520" y="764" text-anchor="middle" font-size="11" fill="#5b3a8c">临时数据 · 最终一致 · 节点对等同步</text>

    <rect x="760" y="722" width="320" height="56" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="920" y="746" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">Raft / JRaft（CP 协议）</text>
    <text x="920" y="764" text-anchor="middle" font-size="11" fill="#5b3a8c">持久数据 · 强一致 · Leader 选举</text>
  </g>

