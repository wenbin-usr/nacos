    <text x="1270" y="646" text-anchor="middle" font-size="11" fill="#0f6b53">自动过期 · 可重入</text>
  </g>

  <!-- arrow L5 -> L6 -->
  <line x1="720" y1="676" x2="720" y2="700" stroke="#9aa4b2" stroke-width="1.6" marker-end="url(#arrow)"/>

