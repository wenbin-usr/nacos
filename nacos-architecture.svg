    <text x="440" y="491" text-anchor="middle" font-size="14" font-weight="600" fill="#312e81">Console Controller</text>
    <text x="440" y="509" text-anchor="middle" font-size="11" fill="#4a4a8a">/v3/console/**</text>

    <rect x="600" y="470" width="240" height="50" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="720" y="491" text-anchor="middle" font-size="14" font-weight="600" fill="#312e81">Console Proxy / Handler</text>
    <text x="720" y="509" text-anchor="middle" font-size="11" fill="#4a4a8a">代理 · 异常处理 · AOT</text>

    <rect x="880" y="470" width="240" height="50" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="1000" y="491" text-anchor="middle" font-size="14" font-weight="600" fill="#312e81">Namespace / Cluster View</text>
    <text x="1000" y="509" text-anchor="middle" font-size="11" fill="#4a4a8a">命名空间 · 集群视图</text>
  </g>

