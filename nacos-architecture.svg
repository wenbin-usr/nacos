    <text x="270" y="630" text-anchor="middle" font-size="11" fill="#0f6b53">注册 · 发现 · 订阅 · 推送</text>
    <text x="270" y="646" text-anchor="middle" font-size="11" fill="#0f6b53">健康检查 · 元数据 · Selector</text>

    <rect x="410" y="588" width="220" height="74" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="520" y="612" text-anchor="middle" font-size="14" font-weight="700" fill="#064e3b">Config 配置管理</text>
    <text x="520" y="630" text-anchor="middle" font-size="11" fill="#0f6b53">发布 · 查询 · 监听 · 灰度</text>
    <text x="520" y="646" text-anchor="middle" font-size="11" fill="#0f6b53">历史 · 容量 · Dump · 一致性</text>

    <rect x="660" y="588" width="220" height="74" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="770" y="612" text-anchor="middle" font-size="14" font-weight="700" fill="#064e3b">AI Registry 注册中心</text>
    <text x="770" y="630" text-anchor="middle" font-size="11" fill="#0f6b53">Prompt · MCP · A2A · Skill</text>
    <text x="770" y="646" text-anchor="middle" font-size="11" fill="#0f6b53">AgentSpec · Agent 管理 · RAD</text>

    <rect x="910" y="588" width="220" height="74" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="1020" y="612" text-anchor="middle" font-size="14" font-weight="700" fill="#064e3b">Core 核心</text>
    <text x="1020" y="630" text-anchor="middle" font-size="11" fill="#0f6b53">集群 · 命名空间 · 权限</text>
    <text x="1020" y="646" text-anchor="middle" font-size="11" fill="#0f6b53">分布式 ID · 监控 · Trace</text>

    <rect x="1160" y="588" width="220" height="74" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="1270" y="612" text-anchor="middle" font-size="14" font-weight="700" fill="#064e3b">Lock 分布式锁</text>
