  <rect x="60" y="822" width="6" height="120" rx="3" fill="#eab308"/>
  <text x="80" y="845" font-size="13" font-weight="700" fill="#713f12">插件 SPI 层</text>
  <text x="80" y="862" font-size="11" fill="#6b7280">Plugin (Java SPI)</text>

  <g filter="url(#shadow)">
    <!-- row 1 -->
    <rect x="170" y="843" width="200" height="44" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
    <text x="270" y="870" text-anchor="middle" font-size="13" font-weight="600" fill="#713f12">Auth 鉴权插件</text>

    <rect x="390" y="843" width="200" height="44" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
    <text x="490" y="870" text-anchor="middle" font-size="13" font-weight="600" fill="#713f12">Visibility 可见性</text>

    <rect x="610" y="843" width="200" height="44" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
    <text x="710" y="870" text-anchor="middle" font-size="13" font-weight="600" fill="#713f12">Datasource 方言</text>

    <rect x="830" y="843" width="200" height="44" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
    <text x="930" y="870" text-anchor="middle" font-size="13" font-weight="600" fill="#713f12">Encryption 加密</text>

    <rect x="1050" y="843" width="200" height="44" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
    <text x="1150" y="870" text-anchor="middle" font-size="13" font-weight="600" fill="#713f12">Trace 链路</text>

    <!-- row 2 -->
    <rect x="170" y="892" width="200" height="44" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
    <text x="270" y="919" text-anchor="middle" font-size="13" font-weight="600" fill="#713f12">Environment 环境</text>

    <rect x="390" y="892" width="200" height="44" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
    <text x="490" y="919" text-anchor="middle" font-size="13" font-weight="600" fill="#713f12">Control 控制插件</text>

    <rect x="610" y="892" width="200" height="44" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
    <text x="710" y="919" text-anchor="middle" font-size="13" font-weight="600" fill="#713f12">Config Change</text>

    <rect x="830" y="892" width="200" height="44" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
    <text x="930" y="919" text-anchor="middle" font-size="13" font-weight="600" fill="#713f12">AI Pipeline</text>

    <rect x="1050" y="892" width="200" height="44" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
    <text x="1150" y="919" text-anchor="middle" font-size="13" font-weight="600" fill="#713f12">AI Storage / Importer</text>
  </g>

  <!-- arrow L7 -> L8 -->
  <line x1="720" y1="946" x2="720" y2="970" stroke="#9aa4b2" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Layer 8 : Persistence -->
  <rect x="60" y="974" width="1320" height="86" rx="10" fill="#ffffff" stroke="#dbe3ee" stroke-width="1"/>
  <rect x="60" y="974" width="6" height="86" rx="3" fill="#14b8a6"/>
  <text x="80" y="997" font-size="13" font-weight="700" fill="#134e4a">持久化层</text>
  <text x="80" y="1014" font-size="11" fill="#6b7280">Persistence</text>

  <g filter="url(#shadow)">
    <rect x="320" y="992" width="240" height="56" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="440" y="1016" text-anchor="middle" font-size="14" font-weight="700" fill="#134e4a">Derby（内嵌）</text>
    <text x="440" y="1034" text-anchor="middle" font-size="11" fill="#0e6b62">开箱即用 · 默认</text>

    <rect x="600" y="992" width="240" height="56" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="720" y="1016" text-anchor="middle" font-size="14" font-weight="700" fill="#134e4a">MySQL</text>
    <text x="720" y="1034" text-anchor="middle" font-size="11" fill="#0e6b62">生产推荐 · 多数据源</text>

    <rect x="880" y="992" width="240" height="56" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="1000" y="1016" text-anchor="middle" font-size="14" font-weight="700" fill="#134e4a">PostgreSQL</text>
    <text x="1000" y="1034" text-anchor="middle" font-size="11" fill="#0e6b62">社区扩展方言</text>
  </g>

  <!-- arrow L8 -> L9 -->
  <line x1="720" y1="1064" x2="720" y2="1086" stroke="#9aa4b2" stroke-width="1.6" marker-end="url(#arrow)"/>

